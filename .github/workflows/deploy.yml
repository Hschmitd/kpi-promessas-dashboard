name: Publicar dashboard

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar dashboard para publicação
        run: |
          rm -rf _site
          mkdir -p _site

          cp -a index.html _site/
          cp -a assets _site/
          cp -a public _site/

          if [ ! -f "_site/index.html" ]; then
            echo "ERRO: index.html não encontrado."
            exit 1
          fi

          if [ ! -f "_site/public/PROMESSAS_20262609.csv" ]; then
            echo "ERRO: base PROMESSAS_20262609.csv não encontrada."
            exit 1
          fi

          echo "Dashboard preparado."
          echo "Tamanho:"
          du -sh _site

      - name: Fazer upload do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
